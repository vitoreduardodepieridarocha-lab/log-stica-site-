<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MON World 3D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: Arial, sans-serif;
        }

        #globe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;

            padding: 12px 18px;

            border: 1px solid rgba(255,255,255,.18);
            border-radius: 12px;

            background: rgba(0,0,0,.55);
            color: white;

            text-decoration: none;
            font-size: 15px;

            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(255,255,255,.12);
        }

        .title {
            position: fixed;
            top: 22px;
            right: 25px;
            z-index: 100;

            color: white;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;

            opacity: .85;
        }

        .instructions {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 100;

            color: rgba(255,255,255,.75);
            font-size: 13px;

            background: rgba(0,0,0,.35);
            padding: 10px 16px;
            border-radius: 20px;

            backdrop-filter: blur(10px);

            white-space: nowrap;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-button">
        ← Voltar
    </a>

    <div class="title">
        MON WORLD
    </div>

    <div id="globe"></div>

    <div class="instructions">
        🖱️ Arraste para girar • 🔍 Scroll para aproximar
    </div>


    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


    <script>

        // =========================
        // CENA
        // =========================

        const scene = new THREE.Scene();


        // =========================
        // CÂMERA
        // =========================

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );

        camera.position.set(0, 0, 2.8);


        // =========================
        // RENDERIZADOR
        // =========================

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setClearColor(0x020617, 1);

        document
            .getElementById("globe")
            .appendChild(renderer.domElement);


        // =========================
        // ILUMINAÇÃO
        // =========================

        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            1.5
        );

        scene.add(ambientLight);


        const sunLight = new THREE.DirectionalLight(
            0xffffff,
            2.5
        );

        sunLight.position.set(
            5,
            3,
            5
        );

        scene.add(sunLight);


        // =========================
        // TERRA
        // =========================

        const geometry = new THREE.SphereGeometry(
            1,
            64,
            64
        );


        // Material inicial azul.
        // Assim o globo aparece mesmo antes
        // da textura terminar de carregar.

        const material = new THREE.MeshStandardMaterial({
            color: 0x1769ff,
            roughness: 0.8,
            metalness: 0
        });


        const earth = new THREE.Mesh(
            geometry,
            material
        );

        scene.add(earth);


        // =========================
        // TEXTURA DA TERRA
        // =========================

        const textureLoader =
            new THREE.TextureLoader();


        textureLoader.load(

            "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",

            function(texture) {

                material.map = texture;

                material.color.set(0xffffff);

                material.needsUpdate = true;

            },

            undefined,

            function(error) {

                console.log(
                    "A textura não carregou. O globo azul continuará funcionando."
                );

            }

        );


        // =========================
        // ATMOSFERA
        // =========================

        const atmosphereGeometry =
            new THREE.SphereGeometry(
                1.035,
                64,
                64
            );


        const atmosphereMaterial =
            new THREE.MeshBasicMaterial({
                color: 0x3b82f6,
                transparent: true,
                opacity: 0.10,
                side: THREE.BackSide
            });


        const atmosphere =
            new THREE.Mesh(
                atmosphereGeometry,
                atmosphereMaterial
            );

        scene.add(atmosphere);


        // =========================
        // CONTROLES
        // =========================

        const controls =
            new THREE.OrbitControls(
                camera,
                renderer.domElement
            );


        controls.enableDamping = true;

        controls.dampingFactor = 0.06;

        controls.enableRotate = true;

        controls.enableZoom = true;

        controls.enablePan = false;

        controls.minDistance = 1.4;

        controls.maxDistance = 6;


        // =========================
        // ANIMAÇÃO
        // =========================

        function animate() {

            requestAnimationFrame(
                animate
            );

            controls.update();

            renderer.render(
                scene,
                camera
            );
        }


        animate();


        // =========================
        // RESPONSIVO
        // =========================

        window.addEventListener(
            "resize",
            function() {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>
</html>
