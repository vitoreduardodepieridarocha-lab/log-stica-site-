<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MON World 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020617;
    font-family: Arial, sans-serif;
}

#globe {
    width: 100%;
    height: 100%;
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;

    padding: 12px 18px;

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 12px;

    background: rgba(0,0,0,.55);
    color: white;

    text-decoration: none;
    font-size: 15px;

    backdrop-filter: blur(10px);
}

.title {
    position: fixed;
    top: 22px;
    right: 25px;
    z-index: 1000;

    color: white;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
}

.country-info {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);

    z-index: 1000;

    min-width: 240px;
    padding: 14px 22px;

    text-align: center;

    color: white;

    background: rgba(0,0,0,.65);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 15px;

    backdrop-filter: blur(12px);

    font-size: 15px;
}

#countryName {
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
}

.instructions {
    position: fixed;
    left: 50%;
    top: 65px;
    transform: translateX(-50%);

    z-index: 1000;

    color: rgba(255,255,255,.75);
    font-size: 12px;

    white-space: nowrap;
}
</style>
</head>

<body>

<a href="index.html" class="back-button">
    ← Voltar
</a>

<div class="title">
    MON WORLD
</div>

<div class="instructions">
    Arraste para girar • Scroll para aproximar • Clique em um país
</div>

<div id="globe"></div>

<div class="country-info">
    País selecionado
    <div id="countryName">Nenhum</div>
</div>


<script src="https://unpkg.com/globe.gl"></script>

<script>

let selectedCountry = null;


/* =========================
   CRIAR GLOBO
========================= */

const globe = Globe()
    (document.getElementById("globe"))

    .backgroundColor("#020617")

    .globeImageUrl(
        "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
    )

    .bumpImageUrl(
        "https://unpkg.com/three-globe/example/img/earth-topology.png"
    )

    /* =========================
       PAÍSES
    ========================= */

    .polygonsData([])

    .polygonAltitude(0.01)

    .polygonCapColor(country => {

        const name =
            country.properties.ADMIN ||
            country.properties.NAME ||
            country.properties.name ||
            "";

        if (name === selectedCountry) {
            return "rgba(0,170,255,0.75)";
        }

        return "rgba(20,100,180,0.20)";
    })

    .polygonSideColor(() => {
        return "rgba(0,80,150,0.15)";
    })

    .polygonStrokeColor(country => {

        const name =
            country.properties.ADMIN ||
            country.properties.NAME ||
            country.properties.name ||
            "";

        if (name === selectedCountry) {
            return "#00d9ff";
        }

        return "rgba(120,190,255,0.65)";
    })

    .polygonLabel(country => {

        const name =
            country.properties.ADMIN ||
            country.properties.NAME ||
            country.properties.name ||
            "País";

        return `
            <div style="
                background:rgba(0,0,0,.8);
                padding:8px 12px;
                border-radius:8px;
                color:white;
                font-size:14px;
            ">
                ${name}
            </div>
        `;
    })

    /* =========================
       CLIQUE NO PAÍS
    ========================= */

    .onPolygonClick(country => {

        selectedCountry =
            country.properties.ADMIN ||
            country.properties.NAME ||
            country.properties.name ||
            "País desconhecido";

        document.getElementById("countryName").textContent =
            selectedCountry;

        globe
            .polygonsData(globe.polygonsData());

    });


/* =========================
   CONTROLES
========================= */

globe.controls().enableZoom = true;
globe.controls().enableRotate = true;
globe.controls().enablePan = false;

globe.controls().minDistance = 120;
globe.controls().maxDistance = 500;


/* =========================
   CARREGAR PAÍSES
========================= */

fetch(
    "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
)

.then(response => response.json())

.then(data => {

    globe.polygonsData(data.features);

})

.catch(error => {

    console.error(
        "Erro ao carregar os países:",
        error
    );

});


/* =========================
   RESPONSIVO
========================= */

window.addEventListener(
    "resize",
    () => {

        globe
            .width(window.innerWidth)
            .height(window.innerHeight);

    }
);

</script>

</body>
</html>
