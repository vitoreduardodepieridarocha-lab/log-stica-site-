<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MON World - Logística Global</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000812;
    font-family:Arial,Helvetica,sans-serif;
}

#globe{
    position:fixed;
    inset:0;
}

/* =========================
   VOLTAR
========================= */

.back{
    position:fixed;
    top:20px;
    left:20px;
    z-index:50;

    padding:11px 17px;

    color:white;
    text-decoration:none;

    background:rgba(2,12,25,.85);
    border:1px solid rgba(80,170,220,.25);
    border-radius:11px;

    backdrop-filter:blur(12px);
}

/* =========================
   TÍTULO
========================= */

.title{
    position:fixed;
    top:23px;
    right:25px;
    z-index:50;

    color:#dff5ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:3px;
}

/* =========================
   AJUDA
========================= */

.help{
    position:fixed;
    top:63px;
    left:50%;
    transform:translateX(-50%);

    z-index:50;

    color:rgba(210,235,250,.65);
    font-size:11px;

    white-space:nowrap;
}

/* =========================
   PAÍS SELECIONADO
========================= */

.country-box{
    position:fixed;
    top:95px;
    left:50%;
    transform:translateX(-50%);

    z-index:50;

    padding:9px 18px;

    min-width:190px;

    text-align:center;

    color:white;

    background:rgba(2,12,25,.78);
    border:1px solid rgba(0,180,255,.25);
    border-radius:12px;

    backdrop-filter:blur(12px);
}

.country-label{
    font-size:9px;
    color:#6e9ab5;
    text-transform:uppercase;
    letter-spacing:2px;
}

#countryName{
    margin-top:3px;
    font-size:16px;
    font-weight:bold;
}

/* =========================
   PAINEL DE ROTA
========================= */

.route-panel{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);

    z-index:100;

    width:min(700px, calc(100% - 30px));

    padding:15px;

    background:rgba(2,10,20,.93);

    border:1px solid rgba(70,170,220,.28);

    border-radius:18px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.55);
}

.route-title{
    color:white;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1.5px;
    margin-bottom:11px;
}

.route-fields{
    display:grid;
    grid-template-columns:1fr 1fr 120px 100px;
    gap:8px;
}

select,
button{
    width:100%;
    height:42px;

    border-radius:9px;

    border:1px solid rgba(120,190,220,.22);

    background:#071827;

    color:white;

    padding:0 10px;

    outline:none;

    font-size:12px;
}

select:focus{
    border-color:#00bfff;
}

button{
    background:#008ed1;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00a9ef;
}

.route-status{
    margin-top:10px;

    color:#83aabd;

    font-size:11px;

    text-align:center;
}

.route-status.active{
    color:#55d8ff;
}

/* =========================
   ANIMAÇÃO DO VEÍCULO
========================= */

.vehicle{
    position:fixed;

    z-index:80;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    pointer-events:none;

    filter:
        drop-shadow(0 0 7px rgba(0,190,255,.8));

    opacity:0;
}

.vehicle.show{
    opacity:1;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .title{
        top:22px;
        right:15px;
        font-size:11px;
    }

    .help{
        top:60px;
        font-size:9px;
    }

    .country-box{
        top:88px;
    }

    .route-panel{
        bottom:10px;
        padding:12px;
    }

    .route-fields{
        grid-template-columns:1fr 1fr;
    }

    .route-fields button,
    .route-fields select:last-of-type{
        width:100%;
    }

}
</style>
</head>

<body>

<a href="index.html" class="back">
    ← Voltar
</a>

<div class="title">
    MON WORLD
</div>

<div class="help">
    Arraste para girar • Scroll para aproximar • Clique em um país
</div>

<div class="country-box">
    <div class="country-label">
        País selecionado
    </div>

    <div id="countryName">
        Nenhum
    </div>
</div>

<div id="globe"></div>

<div id="vehicle" class="vehicle">
    ✈️
</div>


<!-- =========================
     PAINEL DE ROTA
========================= -->

<div class="route-panel">

    <div class="route-title">
        🌎 PLANEJAR TRANSPORTE
    </div>

    <div class="route-fields">

        <select id="origin">
            <option value="">País de origem</option>
        </select>

        <select id="destination">
            <option value="">País de destino</option>
        </select>

        <select id="transport">

            <option value="air">
                ✈️ Avião
            </option>

            <option value="sea">
                🚢 Navio
            </option>

        </select>

        <button id="routeButton">
            CRIAR ROTA
        </button>

    </div>

    <div id="routeStatus" class="route-status">
        Escolha a origem e o destino.
    </div>

</div>


<!-- THREE.JS -->

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const container =
    document.getElementById("globe");

const countryName =
    document.getElementById("countryName");

const originSelect =
    document.getElementById("origin");

const destinationSelect =
    document.getElementById("destination");

const transportSelect =
    document.getElementById("transport");

const routeButton =
    document.getElementById("routeButton");

const routeStatus =
    document.getElementById("routeStatus");

const vehicle =
    document.getElementById("vehicle");


/* =====================================================
   CENA
===================================================== */

const scene =
    new THREE.Scene();


/* =====================================================
   CÂMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        35,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    0,
    3
);


/* =====================================================
   RENDER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:false
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(
    0x000812,
    1
);

container.appendChild(
    renderer.domElement
);


/* =====================================================
   LUZ
===================================================== */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.15
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

sun.position.set(
    5,
    3,
    5
);

scene.add(sun);


/* =====================================================
   TERRA
===================================================== */

const earthGeometry =
    new THREE.SphereGeometry(
        1,
        128,
        128
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({

        color:0x315a72,

        shininess:10,

        specular:0x162b38

    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );

scene.add(earth);


/* =====================================================
   TEXTURA DA TERRA
===================================================== */

const loader =
    new THREE.TextureLoader();


loader.load(

    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",

    function(texture){

        texture.anisotropy =
            renderer.capabilities
            .getMaxAnisotropy();

        earthMaterial.map =
            texture;

        /* deixa a imagem mais escura */

        earthMaterial.color.set(
            0x8ba7b5
        );

        earthMaterial.needsUpdate =
            true;

    }

);


/* =====================================================
   NUVENS
===================================================== */

loader.load(

    "https://threejs.org/examples/textures/planets/earth_clouds_1024.png",

    function(texture){

        const geometry =
            new THREE.SphereGeometry(
                1.008,
                128,
                128
            );

        const material =
            new THREE.MeshPhongMaterial({

                map:texture,

                transparent:true,

                opacity:.16,

                depthWrite:false

            });

        const clouds =
            new THREE.Mesh(
                geometry,
                material
            );

        scene.add(clouds);

        window.cloudLayer =
            clouds;

    }

);


/* =====================================================
   ATMOSFERA
===================================================== */

const atmosphereGeometry =
    new THREE.SphereGeometry(
        1.035,
        128,
        128
    );


const atmosphereMaterial =
    new THREE.MeshBasicMaterial({

        color:0x0879b8,

        transparent:true,

        opacity:.07,

        side:THREE.BackSide

    });


scene.add(
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    )
);


/* =====================================================
   CONTROLES
===================================================== */

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping =
    true;

controls.dampingFactor =
    .05;

controls.enableRotate =
    true;

controls.enableZoom =
    true;

controls.enablePan =
    false;

controls.minDistance =
    1.45;

controls.maxDistance =
    6;


/* =====================================================
   PAÍSES
===================================================== */

let countries = [];

let selectedCountry = null;

let originCountry = null;

let destinationCountry = null;


/* =====================================================
   CAMADA DAS FRONTEIRAS
===================================================== */

const countryLayer =
    new THREE.Group();

scene.add(
    countryLayer
);


/* =====================================================
   CAMADA DA ROTA
===================================================== */

const routeLayer =
    new THREE.Group();

scene.add(
    routeLayer
);


/* =====================================================
   LAT/LON → 3D
===================================================== */

function latLonToVector3(
    lat,
    lon,
    radius
){

    const phi =
        (90 - lat) *
        Math.PI / 180;

    const theta =
        (lon + 180) *
        Math.PI / 180;

    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);

    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    const y =
        radius *
        Math.cos(phi);

    return new THREE.Vector3(
        x,
        y,
        z
    );
}


/* =====================================================
   NOME
===================================================== */

function getCountryName(country){

    if(!country ||
       !country.properties){

        return "País";
    }

    return (
        country.properties.ADMIN ||
        country.properties.NAME ||
        country.properties.name ||
        country.properties.NAME_EN ||
        "País"
    );
}


/* =====================================================
   CENTRO DO PAÍS
===================================================== */

function getCountryCenter(country){

    let coordinates =
        country.geometry.coordinates;

    let point = null;

    if(
        country.geometry.type ===
        "Polygon"
    ){

        point =
            coordinates[0][0];

    }else{

        point =
            coordinates[0][0][0];

    }

    if(!point){

        return {
            lat:0,
            lon:0
        };

    }

    return {
        lon:point[0],
        lat:point[1]
    };

}


/* =====================================================
   DESENHAR FRONTEIRAS
===================================================== */

function drawBorders(){

    countryLayer.clear();

    countries.forEach(
        country => {

            if(
                !country.geometry ||
                !country.geometry.coordinates
            ){
                return;
            }

            const polygons =
                country.geometry.type ===
                "Polygon"

                ? [country.geometry.coordinates]

                : country.geometry.coordinates;


            polygons.forEach(
                polygon => {

                    polygon.forEach(
                        ring => {

                            const points =
                                [];

                            ring.forEach(
                                coord => {

                                    points.push(
                                        latLonToVector3(
                                            coord[1],
                                            coord[0],
                                            1.006
                                        )
                                    );

                                }
                            );


                            if(
                                points.length < 2
                            ){
                                return;
                            }


                            const geometry =
                                new THREE.BufferGeometry()
                                .setFromPoints(
                                    points
                                );


                            const material =
                                new THREE.LineBasicMaterial({

                                    color:0x6f9caf,

                                    transparent:true,

                                    opacity:.55

                                });


                            const line =
                                new THREE.Line(
                                    geometry,
                                    material
                                );


                            line.userData.country =
                                country;


                            countryLayer.add(
                                line
                            );

                        }
                    );

                }
            );

        }
    );

}


/* =====================================================
   DESTACAR PAÍSES
===================================================== */

function updateHighlights(){

    countryLayer.children.forEach(
        line => {

            const c =
                line.userData.country;

            const isOrigin =
                c === originCountry;

            const isDestination =
                c === destinationCountry;

            const isSelected =
                c === selectedCountry;


            if(
                isOrigin ||
                isDestination ||
                isSelected
            ){

                line.material.color.set(
                    isOrigin
                    ? 0x00ff88
                    : 0x00d9ff
                );

                line.material.opacity =
                    1;

            }else{

                line.material.color.set(
                    0x6f9caf
                );

                line.material.opacity =
                    .42;

            }

        }
    );

}


/* =====================================================
   PREENCHER SELECTS
===================================================== */

function populateCountries(){

    const sorted =
        [...countries].sort(
            (a,b) =>
                getCountryName(a)
                .localeCompare(
                    getCountryName(b)
                )
        );


    sorted.forEach(
        country => {

            const name =
                getCountryName(country);


            const option1 =
                document.createElement(
                    "option"
                );

            option1.value =
                name;

            option1.textContent =
                name;

            originSelect.appendChild(
                option1
            );


            const option2 =
                document.createElement(
                    "option"
                );

            option2.value =
                name;

            option2.textContent =
                name;

            destinationSelect.appendChild(
                option2
            );

        }
    );

}


/* =====================================================
   ENCONTRAR PAÍS
===================================================== */

function findCountry(name){

    return countries.find(
        country =>
            getCountryName(country)
            === name
    );

}


/* =====================================================
   ROTA CURVA
===================================================== */

function createRoute(){

    routeLayer.clear();


    if(
        !originCountry ||
        !destinationCountry
    ){
        return;
    }


    const origin =
        getCountryCenter(
            originCountry
        );

    const destination =
        getCountryCenter(
            destinationCountry
        );


    const start =
        latLonToVector3(
            origin.lat,
            origin.lon,
            1.025
        );

    const end =
        latLonToVector3(
            destination.lat,
            destination.lon,
            1.025
        );


    const middle =
        start.clone()
        .add(end)
        .normalize()
        .multiplyScalar(
            1.35
        );


    const curve =
        new THREE.QuadraticBezierCurve3(
            start,
            middle,
            end
        );


    const points =
        curve.getPoints(
            120
        );


    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(
            points
        );


    const material =
        new THREE.LineBasicMaterial({

            color:0x00cfff,

            transparent:true,

            opacity:.9

        });


    const line =
        new THREE.Line(
            geometry,
            material
        );


    routeLayer.add(
        line
    );


    animateVehicle(
        curve
    );

}


/* =====================================================
   ANIMAÇÃO AVIÃO/NAVIO
===================================================== */

let animationId = null;


function animateVehicle(curve){

    if(animationId){

        cancelAnimationFrame(
            animationId
        );

    }


    vehicle.classList.add(
        "show"
    );


    const type =
        transportSelect.value;


    vehicle.textContent =
        type === "sea"
        ? "🚢"
        : "✈️";


    const startTime =
        performance.now();


    const duration =
        8000;


    function move(now){

        const elapsed =
            now - startTime;


        let progress =
            (elapsed % duration) /
            duration;


        const point =
            curve.getPoint(
                progress
            );


        const projected =
            point.clone()
        ;

        projected.project(
            camera
        );


        const x =
            (projected.x * .5 + .5) *
            window.innerWidth;


        const y =
            (-projected.y * .5 + .5) *
            window.innerHeight;


        vehicle.style.left =
            (x - 21) + "px";


        vehicle.style.top =
            (y - 21) + "px";


        animationId =
            requestAnimationFrame(
                move
            );

    }


    animationId =
        requestAnimationFrame(
            move
        );

}


/* =====================================================
   CRIAR ROTA PELO BOTÃO
===================================================== */

routeButton.addEventListener(
    "click",
    function(){

        const originName =
            originSelect.value;

        const destinationName =
            destinationSelect.value;


        if(
            !originName ||
            !destinationName
        ){

            routeStatus.textContent =
                "Escolha os dois países.";

            routeStatus.classList.remove(
                "active"
            );

            return;

        }


        if(
            originName ===
            destinationName
        ){

            routeStatus.textContent =
                "A origem e o destino precisam ser diferentes.";

            return;

        }


        originCountry =
            findCountry(
                originName
            );

        destinationCountry =
            findCountry(
                destinationName
            );


        selectedCountry =
            null;


        countryName.textContent =
            originName +
            " → " +
            destinationName;


        updateHighlights();


        createRoute();


        const vehicleName =
            transportSelect.value ===
            "sea"
            ? "navio"
            : "avião";


        routeStatus.textContent =
            vehicleName.toUpperCase() +
            " em rota: " +
            originName +
            " → " +
            destinationName;

        routeStatus.classList.add(
            "active"
        );

    }
);


/* =====================================================
   CLIQUE NOS PAÍSES
===================================================== */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "pointerdown",
    function(event){

        const rect =
            renderer.domElement
            .getBoundingClientRect();


        mouse.x =
            ((event.clientX -
            rect.left) /
            rect.width) *
            2 - 1;


        mouse.y =
            -((event.clientY -
            rect.top) /
            rect.height) *
            2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                countryLayer.children
            );


        if(hits.length){

            const country =
                hits[0].object
                .userData.country;


            selectedCountry =
                country;


            countryName.textContent =
                getCountryName(
                    country
                );


            updateHighlights();

        }

    }
);


/* =====================================================
   CARREGAR PAÍSES
===================================================== */

fetch(
    "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
)

.then(
    response => {

        if(!response.ok){

            throw new Error(
                "Erro ao carregar países"
            );

        }

        return response.json();

    }
)

.then(
    data => {

        countries =
            data.features;

        drawBorders();

        populateCountries();

    }
)

.catch(
    error => {

        console.error(
            error
        );

        routeStatus.textContent =
            "Não foi possível carregar os países.";

    }
);


/* =====================================================
   ANIMAÇÃO PRINCIPAL
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    controls.update();


    if(
        window.cloudLayer
    ){

        window.cloudLayer.rotation.y +=
            .00004;

    }


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================================
   RESPONSIVO
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
